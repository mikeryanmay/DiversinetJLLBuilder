name: Build JLL artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the generated JLL and binaries to Diversinet_jll
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BINARYBUILDER_RUNNER: docker
      BINARYBUILDER_AUTOMATIC_APPLE: "true"
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin-julia_version+1.12.0
          - x86_64-apple-darwin-julia_version+1.12.0
          - aarch64-linux-gnu-libgfortran5-cxx11-julia_version+1.12.0
          - x86_64-linux-gnu-libgfortran5-cxx11-julia_version+1.12.0

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2

      - name: Instantiate BinaryBuilder
        shell: bash
        run: julia --startup-file=no --project=. -e 'import Pkg; Pkg.instantiate()'

      - name: Build and audit artifact
        shell: bash
        run: |
          julia --startup-file=no --project=. build_tarballs.jl "${{ matrix.target }}" --verbose 2>&1 | tee binarybuilder.log
          if grep -Fq 'Linked library libgcc_s.so.1 could not be resolved' binarybuilder.log; then
              echo 'BinaryBuilder did not resolve libgcc_s.so.1 from CompilerSupportLibraries_jll.' >&2
              exit 1
          fi

      - name: Upload artifact and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Diversinet-${{ matrix.target }}
          path: |
            products/
            binarybuilder.log
            build/**/*.log
          if-no-files-found: warn

  package-and-test:
    name: Generate and smoke-test JLL wrapper
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2

      - name: Instantiate BinaryBuilder
        shell: bash
        run: julia --startup-file=no --project=. -e 'import Pkg; Pkg.instantiate()'

      - name: Download all platform products
        uses: actions/download-artifact@v4
        with:
          pattern: Diversinet-*
          path: .
          merge-multiple: true

      - name: Generate local JLL wrapper
        shell: bash
        run: >-
          julia --startup-file=no --project=. build_tarballs.jl
          'aarch64-apple-darwin-julia_version+1.12.0,x86_64-apple-darwin-julia_version+1.12.0,aarch64-linux-gnu-libgfortran5-cxx11-julia_version+1.12.0,x86_64-linux-gnu-libgfortran5-cxx11-julia_version+1.12.0'
          --skip-build --deploy=local --verbose

      - name: Smoke-test generated wrapper in a clean depot
        shell: bash
        env:
          JULIA_DEPOT_PATH: ${{ runner.temp }}/diversinet-clean-depot
        run: |
          julia --startup-file=no -e '
              import Pkg
              Pkg.develop(path=joinpath(ENV["HOME"], ".julia", "dev", "Diversinet_jll"))
              Pkg.instantiate()
              using Diversinet_jll, Libdl
              @assert isfile(Diversinet_jll.libdiversinet)
              @assert isfile(Diversinet_jll.libjlDiversinetInterface)
              Libdl.dlclose(Libdl.dlopen(Diversinet_jll.libdiversinet))
              Libdl.dlclose(Libdl.dlopen(Diversinet_jll.libjlDiversinetInterface))
          '

      - name: Publish JLL wrapper and binary release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        env:
          DIVERSINET_JLL_VERSION: '0.1.0+1'
          GITHUB_TOKEN: ${{ secrets.JLL_DEPLOY_TOKEN }}
          JULIA_DEPOT_PATH: '${{ runner.temp }}/diversinet-publish-depot:'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          julia --startup-file=no --project=. -e 'import Pkg; Pkg.instantiate()'
          julia --startup-file=no --project=. build_tarballs.jl \
            'aarch64-apple-darwin-julia_version+1.12.0,x86_64-apple-darwin-julia_version+1.12.0,aarch64-linux-gnu-libgfortran5-cxx11-julia_version+1.12.0,x86_64-linux-gnu-libgfortran5-cxx11-julia_version+1.12.0' \
            --skip-build --deploy=mikeryanmay/Diversinet_jll --verbose

      - name: Upload generated wrapper
        uses: actions/upload-artifact@v4
        with:
          name: Diversinet_jll-generated-wrapper
          path: ~/.julia/dev/Diversinet_jll
          if-no-files-found: error

  native-published-smoke-test:
    name: Published JLL smoke test (${{ matrix.os }})
    needs: package-and-test
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15

    steps:
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Install and initialize the published JLL
        shell: bash
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          julia --startup-file=no -e '
              import Pkg
              Pkg.add(url="https://github.com/mikeryanmay/Diversinet_jll.git")
              Pkg.add(name="CxxWrap", version="0.17")
              import Diversinet_jll, Libdl
              module DiversinetBridgeSmoke
                  using CxxWrap
                  import Diversinet_jll
                  @wrapmodule(() -> Diversinet_jll.libjlDiversinetInterface)
                  function __init__()
                      @initcxx
                  end
              end
              DiversinetBridgeSmoke.__init__()
              core = realpath(Diversinet_jll.libdiversinet)
              @assert isfile(core)
              @assert isfile(Diversinet_jll.libjlDiversinetInterface)
              Libdl.dlclose(Libdl.dlopen(core))
              Libdl.dlclose(Libdl.dlopen(Diversinet_jll.libjlDiversinetInterface))
              loaded_core = filter(
                  path -> occursin("libdiversinet", lowercase(path)) &&
                          realpath(path) == core,
                  Libdl.dllist(),
              )
              @assert !isempty(loaded_core)
              println("CxxWrap initialized with artifact core: ", core)
          '
